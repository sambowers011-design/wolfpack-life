<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">W</span>
        <span class="brand-name">Wolfpack Life</span>
      </a>
      <nav class="app-nav">
        <a class="app-nav-link" href="board.html">Home</a>
        <a class="app-nav-link" href="today.html">Today</a>
        <a class="app-nav-link" href="classes.html">Classes</a>
        <a class="app-nav-link active" href="calendar.html">Calendar</a>
        <a class="app-nav-link" href="profile.html">Profile</a>
        <button type="button" class="header-cta link-btn" id="signOutBtn">Sign out →</button>

  <main>
    <section class="today-hero">
      <div class="wrap">
        <p class="eyebrow">Calendar</p>
        <h1 class="board-hero-title" id="rangeHeading">—</h1>
        <p class="hero-sub" id="guestNotice" hidden>

        </p>
      </div>
    </section>

    <section class="today-body">
      <div class="wrap">
        <div class="week-nav">
          <button type="button" class="link-btn" id="prevWeekBtn">← Prev week</button>
          <button type="button" class="link-btn" id="thisWeekBtn">This week</button>
          <button type="button" class="link-btn" id="nextWeekBtn">Next week →</button>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-links">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </div>
      <a class="footer-cta" href="board.html">← Back to board</a>
    </div>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="calendar.js"></script>
