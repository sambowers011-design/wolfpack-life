<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goals / Wolfpack Life</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23CC0000%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22>W</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">W</span>
        <span class="brand-name">Wolfpack Life</span>
      </a>
      <nav class="app-nav">
        <a class="app-nav-link" href="board.html">Home</a>
        <a class="app-nav-link" href="today.html">Today</a>
        <a class="app-nav-link active" href="goals.html">Goals</a>
        <a class="app-nav-link" href="classes.html">Classes</a>
        <a class="app-nav-link" href="calendar.html">Calendar</a>
        <a class="app-nav-link" href="profile.html">Profile</a>
        <button type="button" class="header-cta link-btn" id="signOutBtn">Sign out →</button>
      </nav>
    </div>
  </header>

  <main>
    <section class="today-hero">
      <div class="wrap">
        <p class="eyebrow">Goals</p>
        <h1 class="board-hero-title">Track what you're working toward.</h1>
        <p class="hero-sub" id="guestNotice" hidden>
          You're browsing as a guest — nothing you add here is saved. <a class="link-btn-inline" href="account.html?mode=create">Create an account</a> to keep it.
        </p>
      </div>
    </section>

    <section class="today-body">
      <div class="wrap">
        <div class="panel">
          <div class="panel-header">
            <h2>Your goals</h2>
            <button type="button" class="link-btn" id="toggleGoalForm">+ Add goal</button>
          </div>

          <form id="goalForm" class="inline-form" hidden>
            <p class="form-mode-label" id="formModeLabel">New goal</p>
            <label class="field">
              <span>Goal</span>
              <input type="text" id="goalTitleInput" required />
            </label>
            <label class="field">
              <span>Term</span>
              <input type="text" id="goalTermInput" required />
            </label>
            <label class="field">
              <span>Notes (optional)</span>
              <input type="text" id="goalNotesInput" />
            </label>
            <div class="field-error" id="goalFormError" hidden></div>
            <div class="form-actions">
              <button type="submit" class="btn btn-solid btn-small" id="goalSubmitBtn">Add goal</button>
              <button type="button" class="link-btn" id="cancelEditBtn" hidden>Cancel</button>
            </div>
          </form>

          <div id="goalGroups"></div>
          <p class="empty-state" id="goalsEmpty" hidden>No goals yet — add your first one above.</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-links">
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
      </div>
      <a class="footer-cta" href="board.html">← Back to board</a>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="data.js"></script>
  <script src="goals.js"></script>
</body>
</html>
