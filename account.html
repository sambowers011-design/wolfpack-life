<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in / Wolfpack Life</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2218%22 fill=%22%23CC0000%22/><text x=%2250%22 y=%2268%22 font-size=%2258%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22white%22 text-anchor=%22middle%22>W</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">W</span>
        <span class="brand-name">Wolfpack Life</span>
      </a>
      <a class="header-cta" href="index.html">← Back</a>
    </div>
  </header>

  <main>
    <section class="auth-section">
      <div class="wrap auth-wrap">
        <div class="auth-card">
          <p class="eyebrow" id="authEyebrow">Welcome back.</p>
          <h1 class="auth-title" id="authTitle">Sign in</h1>

          <div class="form-error" id="formError" hidden></div>

          <form id="authForm" novalidate>
            <label class="field" id="nameField" hidden>
              <span>Name</span>
              <input type="text" id="nameInput" name="name" autocomplete="name" />
            </label>

            <label class="field">
              <span>Email</span>
              <input type="email" id="emailInput" name="email" autocomplete="email" required />
            </label>

            <label class="field">
              <span>Password</span>
              <input type="password" id="passwordInput" name="password" autocomplete="current-password" required minlength="8" />
            </label>

            <button type="submit" class="btn btn-solid auth-submit" id="submitBtn">Sign in</button>
          </form>

          <p class="auth-switch">
            <span id="switchPrompt">Need an account?</span>
            <button type="button" class="link-btn" id="switchBtn">Create one</button>
          </p>

          <p class="auth-switch">
            <button type="button" class="link-btn" id="guestBtn">Browse as a guest instead</button>
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <div class="footer-links">
        <a href="#privacy">Privacy</a>
        <a href="#terms">Terms</a>
      </div>
      <a class="footer-cta" href="index.html">← Back to welcome</a>
    </div>
  </footer>

  <script src="auth.js"></script>
  <script src="account.js"></script>
</body>
</html>
